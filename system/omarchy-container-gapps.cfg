// omarchy-container-gapps loader, installed to /usr/lib/firefox/ by install.sh.
// Runs for every Firefox profile but returns at once unless the profile has a
// gapps/gapps.sys.mjs file, which only the Mail/Calendar app profile has.
try {
  const dir = Services.dirsvc.get("ProfD", Ci.nsIFile);
  dir.append("gapps");
  const entry = dir.clone();
  entry.append("gapps.sys.mjs");
  if (entry.exists()) {
    Services.io
      .getProtocolHandler("resource")
      .QueryInterface(Ci.nsIResProtocolHandler)
      .setSubstitution("omarchy-gapps", Services.io.newFileURI(dir));
    ChromeUtils.importESModule("resource://omarchy-gapps/gapps.sys.mjs");
  }
} catch (e) {
  console.error("omarchy-container-gapps:", e);
}
