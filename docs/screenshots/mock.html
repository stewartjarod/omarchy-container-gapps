<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>omarchy-container-gapps mockups</title>
<!-- Mockups for the README: the app's pill strip as styled in firefox/gapps.css,
     around a generic webmail/calendar page. All names and data are made up.
     Rendered by render.cjs: mock.html?view=<mail|calendar|add|overview|themes|social>&theme=<name> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--desk);
    color: var(--fg);
  }

  /* ---- Desktop + window ---- */
  .desk {
    display: grid;
    place-items: center;
    padding: 36px;
    background:
      radial-gradient(1200px 600px at 15% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
      radial-gradient(900px 500px at 100% 100%, color-mix(in srgb, var(--magenta) 18%, transparent), transparent 70%),
      var(--desk);
  }
  .window {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg);
    border: 2px solid var(--accent);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .45), 0 4px 16px rgba(0, 0, 0, .25);
    display: flex;
    flex-direction: column;
  }

  /* ---- Pill strip (mirrors firefox/gapps.css) ---- */
  .strip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
  }
  .pill.selected {
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--border);
    color: var(--fg);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--c);
    opacity: .55;
  }
  .pill.selected .dot {
    opacity: 1;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent);
  }
  .count {
    min-width: 22px;
    padding: 3px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--bg);
    background: var(--c);
  }
  .add {
    width: 26px; height: 26px;
    margin-left: 4px;
    border-radius: 999px;
    border: 1px dashed var(--border-strong);
    display: grid; place-items: center;
    color: var(--muted);
  }
  .add.open { border-style: solid; border-color: var(--muted); color: var(--fg); background: var(--hover); }
  .spacer { flex: 1; }
  .ext {
    width: 28px; height: 28px; border-radius: 999px;
    display: grid; place-items: center;
    color: var(--muted);
  }
  .app-label {
    padding: 0 4px 0 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: .75;
  }

  /* ---- Generic webmail page (light, like the real page) ---- */
  .page { position: relative; flex: 1; display: flex; background: #f6f8fc; color: #1f1f1f; min-height: 0; }
  .rail { width: 236px; padding: 12px 8px; flex: none; }
  .compose {
    display: inline-flex; align-items: center; gap: 12px;
    height: 52px; padding: 0 22px 0 18px; margin: 4px 0 14px 4px;
    border-radius: 16px; background: #c2e7ff; font-weight: 500; font-size: 14px;
  }
  .nav { display: flex; align-items: center; gap: 16px; height: 32px; padding: 0 12px 0 22px; border-radius: 0 16px 16px 0; font-size: 14px; color: #444; }
  .nav.on { background: #d3e3fd; font-weight: 700; color: #0b1a33; }
  .nav .n { margin-left: auto; font-size: 12px; font-weight: 600; }
  .nav-h { font-size: 14px; font-weight: 500; padding: 18px 22px 6px; color: #1f1f1f; }
  .label-dot { width: 10px; height: 10px; border-radius: 3px; }
  .main { flex: 1; display: flex; flex-direction: column; padding: 8px 16px 0 0; min-width: 0; }
  .search {
    height: 46px; border-radius: 24px; background: #e9eef6; display: flex; align-items: center; gap: 14px;
    padding: 0 18px; color: #5f6368; font-size: 15px; width: min(720px, 100%); margin-bottom: 10px;
  }
  .list { flex: 1; background: #fff; border-radius: 16px 16px 0 0; overflow: hidden; }
  .toolbar { height: 48px; display: flex; align-items: center; gap: 22px; padding: 0 18px; color: #5f6368; border-bottom: 1px solid #f1f3f4; font-size: 13px; }
  .row { display: grid; grid-template-columns: 22px 22px 200px 1fr 70px; gap: 12px; align-items: center; height: 40px; padding: 0 18px; border-bottom: 1px solid #f1f3f4; font-size: 14px; color: #3c4043; }
  .row.unread { background: #fff; color: #1f1f1f; font-weight: 700; }
  .row:not(.unread) { background: #f2f6fc; }
  .row .subj { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row .snip { font-weight: 400; color: #5f6368; }
  .row .when { text-align: right; font-size: 12px; }
  .chk { width: 15px; height: 15px; border: 2px solid #9aa0a6; border-radius: 3px; }
  .star { color: #9aa0a6; font-size: 16px; line-height: 1; }
  .star.on { color: #f4b400; }
  .tag { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; background: #e8eaed; color: #3c4043; }

  /* ---- Generic calendar page ---- */
  .cal { flex: 1; display: flex; background: #fff; color: #1f1f1f; min-height: 0; }
  .cal-side { width: 236px; padding: 14px 16px; flex: none; background: #f8fafd; }
  .create { display: inline-flex; align-items: center; gap: 12px; height: 52px; padding: 0 22px 0 18px; border-radius: 16px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); font-weight: 500; font-size: 14px; margin-bottom: 20px; }
  .mini { font-size: 11px; color: #3c4043; }
  .mini-h { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .mini-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 0; text-align: center; }
  .mini-g span { height: 22px; line-height: 22px; border-radius: 50%; }
  .mini-g .t { background: #0b57d0; color: #fff; font-weight: 600; width: 22px; justify-self: center; }
  .mini-g .o { color: #9aa0a6; }
  .cals { margin-top: 22px; font-size: 13px; }
  .cals div { display: flex; gap: 10px; align-items: center; height: 28px; }
  .cals i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .week { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .week-top { height: 56px; display: flex; align-items: center; gap: 18px; padding: 0 20px; font-size: 20px; border-bottom: 1px solid #e0e3e7; }
  .today-btn { font-size: 13px; font-weight: 500; padding: 7px 16px; border: 1px solid #747775; border-radius: 18px; }
  .days { display: grid; grid-template-columns: 56px repeat(5, 1fr); border-bottom: 1px solid #e0e3e7; }
  .days div { text-align: center; padding: 8px 0 6px; font-size: 11px; font-weight: 500; color: #444; }
  .days b { display: block; font-size: 24px; font-weight: 400; margin-top: 2px; color: #1f1f1f; }
  .days .now b { background: #0b57d0; color: #fff; width: 44px; height: 44px; line-height: 44px; border-radius: 50%; margin: 2px auto 0; }
  .grid { flex: 1; position: relative; display: grid; grid-template-columns: 56px repeat(5, 1fr); overflow: hidden; }
  .hours { position: relative; }
  .hours span { position: absolute; right: 8px; font-size: 10px; color: #70757a; transform: translateY(-6px); }
  .col { position: relative; border-left: 1px solid #e0e3e7; }
  .hline { position: absolute; left: 56px; right: 0; height: 1px; background: #e0e3e7; }
  .ev { z-index: 2; position: absolute; left: 4px; right: 6px; border-radius: 6px; padding: 4px 8px; font-size: 12px; color: #fff; overflow: hidden; line-height: 1.3; }
  .ev b { display: block; font-weight: 600; }
  .nowline { z-index: 3; position: absolute; left: 0; right: 0; height: 2px; background: #ea4335; }
  .nowline::before { content: ""; position: absolute; left: -6px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: #ea4335; }

  /* ---- Add-account popover (mirrors gapps.css) ---- */
  .pop {
    position: absolute; top: 6px; z-index: 5;
    width: 300px; padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
    border-radius: 14px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg);
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
    font-size: 13px;
  }
  .pop-t { font-size: 15px; font-weight: 600; }
  .pop-h { margin-top: -10px; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .f { display: flex; flex-direction: column; gap: 6px; }
  .f > span { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .f > span em { font-style: normal; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .in { height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; }
  .in.focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .in .caret { width: 1px; height: 16px; background: var(--fg); margin-left: 1px; }
  .chips { display: flex; gap: 8px; }
  .chip { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .sw { display: flex; gap: 8px; }
  .sw i { width: 22px; height: 22px; border-radius: 50%; background: var(--c); }
  .sw i.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c); }
  .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
  .btn { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); display: grid; place-items: center; font-weight: 500; }
  .btn.p { border-color: transparent; background: var(--accent); color: var(--bg); font-weight: 600; }

  /* ---- Overview / themes / social cards ---- */
  .card { padding: 44px 48px; background: var(--bg); color: var(--fg); }
  .card h1 { margin: 0 0 6px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .card p.lead { margin: 0 0 28px; color: var(--muted); font-size: 15px; }
  .big-strip { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transform-origin: top left; }
  .feats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 26px; }
  .feat { padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  .feat .k { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; min-height: 28px; }
  .feat b { display: block; font-size: 14px; margin-bottom: 4px; }
  .feat span { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  kbd {
    font: 600 12px/1 Inter, sans-serif; color: var(--fg);
    padding: 6px 8px; min-width: 26px; text-align: center;
    border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--bg); box-shadow: 0 2px 0 var(--border);
  }
  .theme-row { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 18px; }
  .theme-row + .theme-row { margin-top: 14px; }
  .theme-name { font-size: 13px; font-weight: 600; color: var(--label); }
  .themes-wrap { padding: 36px 40px; background: #0f1014; }

  .social { width: 1280px; height: 640px; position: relative; overflow: hidden; }
  .social .copy { position: absolute; left: 72px; top: 92px; width: 520px; z-index: 2; }
  .social h1 { font-size: 54px; line-height: 1.05; margin: 0 0 18px; letter-spacing: -.02em; }
  .social h1 span { color: var(--accent); }
  .social p { font-size: 21px; line-height: 1.45; color: var(--muted); margin: 0 0 30px; }
  .social .keys { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 15px; }
  .social .shot { position: absolute; left: 640px; top: 96px; width: 900px; height: 600px; }
  .social .repo { position: absolute; left: 72px; bottom: 54px; font-size: 15px; color: var(--muted); z-index: 2; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const THEMES = {
  "tokyo-night": { name: "Tokyo Night", mode: "dark", accent: "#7aa2f7", background: "#1a1b26", lighter_background: "#24283b", foreground: "#a9b1d6", dark_foreground: "#565f89", red: "#f7768e", yellow: "#e0af68", orange: "#eb927b", green: "#9ece6a", cyan: "#449dab", blue: "#7aa2f7", magenta: "#ad8ee6" },
  "gruvbox": { name: "Gruvbox", mode: "dark", accent: "#7daea3", background: "#282828", lighter_background: "#3c3836", foreground: "#d4be98", dark_foreground: "#7c6f64", red: "#ea6962", yellow: "#d8a657", orange: "#e1875c", green: "#a9b665", cyan: "#89b482", blue: "#7daea3", magenta: "#d3869b" },
  "catppuccin-latte": { name: "Catppuccin Latte", mode: "light", accent: "#1e66f5", background: "#eff1f5", lighter_background: "#dce0e8", foreground: "#4c4f69", dark_foreground: "#9ca0b0", red: "#d20f39", yellow: "#df8e1d", orange: "#d84e2b", green: "#40a02b", cyan: "#179299", blue: "#1e66f5", magenta: "#ea76cb" },
  "rose-pine": { name: "Rosé Pine Dawn", mode: "light", accent: "#56949f", background: "#faf4ed", lighter_background: "#f2e9e1", foreground: "#575279", dark_foreground: "#9893a5", red: "#b4637a", yellow: "#ea9d34", orange: "#cf8057", green: "#286983", cyan: "#d7827e", blue: "#56949f", magenta: "#907aa9" },
};

const mix = (a, b, t) => {
  const p = h => h.match(/\w\w/g).map(x => parseInt(x, 16));
  const [x, y] = [p(a), p(b)];
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join("");
};

// Same derivations as applyTheme() in firefox/gapps.sys.mjs.
function vars(t) {
  return {
    "--bg": t.background, "--fg": t.foreground, "--accent": t.accent,
    "--muted": t.dark_foreground, "--surface": t.lighter_background,
    "--hover": mix(t.background, t.foreground, .05), "--border": mix(t.background, t.foreground, .1),
    "--border-strong": mix(t.background, t.foreground, .2), "--magenta": t.magenta,
    "--desk": t.mode === "light" ? mix(t.background, "#000000", .06) : mix(t.background, "#000000", .35),
    "--label": t.foreground,
  };
}
const styleOf = t => Object.entries(vars(t)).map(([k, v]) => `${k}:${v}`).join(";");

const ICONS = {
  plus: `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>`,
  key: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-3 3 3 3m-6 0 2 2"/></svg>`,
  pencil: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m14 6 4 4"/></svg>`,
  search: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>`,
  inbox: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5L16 13h5M3 13l3-8h12l3 8v6H3z"/></svg>`,
  plusCal: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
};

function strip(t, { app, accounts, selected, addOpen = false }) {
  const pills = accounts.map(a => `
    <div class="pill ${a.label === selected ? "selected" : ""}" style="--c:${t[a.color] || a.color}">
      <span class="dot"></span><span>${a.label}</span>${a.count ? `<span class="count">${a.count}</span>` : ""}
    </div>`).join("");
  return `<div class="strip">${pills}<div class="add ${addOpen ? "open" : ""}">${ICONS.plus}</div>
    <div class="spacer"></div><div class="ext">${ICONS.key}</div><div class="app-label">${app}</div></div>`;
}

const MAIL_ACCOUNTS = [
  { label: "Personal", color: "accent", count: 3 },
  { label: "Studio", color: "orange", count: 12 },
  { label: "Side", color: "green" },
];
const CAL_ACCOUNTS = [
  { label: "Personal", color: "accent" },
  { label: "Studio", color: "orange" },
  { label: "Family", color: "magenta" },
];

const EMAILS = [
  ["Maya Lindqvist", "Q4 launch plan — final review", "Attached the deck with the timeline changes we talked about on Monday…", "10:42 AM", 1, 1],
  ["Northwind Billing", "Your invoice INV-20431 is ready", "Thanks for your business. Your invoice for October is now available…", "9:15 AM", 1, 0, "Receipts"],
  ["Theo Park", "Re: logo options", "Option B reads much better at small sizes. Can we try it on the dark…", "8:58 AM", 1, 0],
  ["Priya Raman", "Contract draft v3", "Made the edits to section 4. Only open question is the payment terms…", "8:30 AM", 1, 1, "Clients"],
  ["Calendar", "Invitation: Design sync @ Thu 2pm", "You have been invited to the following event. Join with the meeting link…", "Yesterday", 1, 0],
  ["Jonah Weiss", "Photos from the offsite", "Uploaded everything to the shared folder — a few really good ones of…", "Yesterday", 0, 0],
  ["Atlas Airlines", "Your trip to Lisbon is confirmed", "Booking reference K7Q2PX · Departs Nov 12, 7:05 AM · Seat 14A…", "Oct 13", 0, 1, "Travel"],
  ["Elena Costa", "Quick question about the API", "Is the v2 endpoint still rate limited to 100 requests per minute, or…", "Oct 13", 0, 0, "Clients"],
  ["Studio Weekly", "This week: three launches and a retro", "Highlights from the team — shipped the new onboarding flow, the…", "Oct 12", 0, 0],
  ["Sam Okafor", "Lunch Friday?", "There's a new ramen place two blocks from the office, want to try…", "Oct 12", 0, 0],
  ["Hosting Co.", "Scheduled maintenance on Oct 20", "We'll be upgrading the database cluster between 02:00 and 03:00 UTC…", "Oct 11", 0, 0],
  ["Lena Fischer", "Re: hiring loop for the design role", "Scheduled the portfolio reviews for next Tuesday and Wednesday…", "Oct 11", 0, 0],
  ["Bookshop", "Your order has shipped", "Good news — your order is on its way. Track your package any time…", "Oct 10", 0, 0, "Receipts"],
];

function mailPage() {
  const rows = EMAILS.map(([from, subj, snip, when, unread, star, tag]) => `
    <div class="row ${unread ? "unread" : ""}"><span class="chk"></span><span class="star ${star ? "on" : ""}">${star ? "★" : "☆"}</span>
      <span>${from}</span><span class="subj">${tag ? `<span class="tag">${tag}</span>` : ""}${subj} <span class="snip">— ${snip}</span></span><span class="when">${when}</span></div>`).join("");
  const nav = [["Inbox", "12", 1], ["Starred"], ["Snoozed"], ["Sent"], ["Drafts", "2"], ["Archive"]]
    .map(([n, c, on]) => `<div class="nav ${on ? "on" : ""}">${on ? ICONS.inbox : `<span style="width:18px"></span>`}<span>${n}</span>${c ? `<span class="n">${c}</span>` : ""}</div>`).join("");
  const labels = [["Clients", "#16a765"], ["Receipts", "#4986e7"], ["Travel", "#f691b2"]]
    .map(([n, c]) => `<div class="nav"><span class="label-dot" style="background:${c}"></span><span>${n}</span></div>`).join("");
  return `<div class="page"><div class="rail"><div class="compose">${ICONS.pencil}Compose</div>${nav}<div class="nav-h">Labels</div>${labels}</div>
    <div class="main"><div class="search">${ICONS.search}Search mail</div><div class="list">
    <div class="toolbar"><span class="chk"></span><span>↻</span><span>⋮</span><span style="margin-left:auto">1–13 of 214</span></div>${rows}</div></div></div>`;
}

function calendarPage() {
  const H0 = 8, H1 = 18, PX = 52;
  const hours = Array.from({ length: H1 - H0 }, (_, i) => H0 + i);
  const fmt = h => (h % 12 || 12) + (h < 12 ? " AM" : " PM");
  const clock = h => `${Math.floor(h) % 12 || 12}${h % 1 ? ":30" : ""} ${h < 12 ? "AM" : "PM"}`;
  const events = [
    [0, 9, 10, "Standup", "Studio", "#f4511e"], [0, 11, 12.5, "Client review: Northwind", "Studio", "#f4511e"], [0, 15, 16, "Dentist", "Personal", "#7986cb"],
    [1, 9, 10, "Standup", "Studio", "#f4511e"], [1, 10.5, 12, "Design sync", "Studio", "#f4511e"], [1, 17, 18, "Climbing", "Personal", "#7986cb"],
    [2, 9, 10, "Standup", "Studio", "#f4511e"], [2, 13, 14, "Lunch with Sam", "Personal", "#7986cb"], [2, 14.5, 16.5, "Workshop: onboarding", "Studio", "#f4511e"],
    [3, 9, 10, "Standup", "Studio", "#f4511e"], [3, 12, 13, "School pickup", "Family", "#8e24aa"], [3, 14, 15, "Design sync", "Studio", "#f4511e"],
    [4, 9, 10, "Standup", "Studio", "#f4511e"], [4, 11, 12, "1:1 Maya", "Studio", "#f4511e"], [4, 16, 18, "Movie night", "Family", "#8e24aa"],
  ];
  const cols = [0, 1, 2, 3, 4].map(d => `<div class="col">${events.filter(e => e[0] === d).map(([, s, e, t, c, col]) =>
    `<div class="ev" style="top:${(s - H0) * PX + 1}px;height:${(e - s) * PX - 3}px;background:${col}"><b>${t}</b>${clock(s)} · ${c}</div>`).join("")}
    ${d === 2 ? `<div class="nowline" style="top:${(10.7 - H0) * PX}px"></div>` : ""}</div>`).join("");
  const lines = hours.map((h, i) => `<div class="hline" style="top:${i * PX}px"></div>`).join("");
  const labels = hours.map((h, i) => i ? `<span style="top:${i * PX}px">${fmt(h)}</span>` : "").join("");
  const mini = ["S", "M", "T", "W", "T", "F", "S"].map(d => `<span>${d}</span>`).join("") +
    [27, 28, 29, 30].map(d => `<span class="o">${d}</span>`).join("") +
    Array.from({ length: 31 }, (_, i) => `<span class="${i + 1 === 14 ? "t" : ""}">${i + 1}</span>`).join("");
  return `<div class="cal"><div class="cal-side"><div class="create">${ICONS.plusCal}Create</div>
    <div class="mini"><div class="mini-h">October 2026</div><div class="mini-g">${mini}</div></div>
    <div class="cals"><div class="mini-h" style="margin:0">My calendars</div>
    <div><i style="background:#f4511e"></i>Studio</div><div><i style="background:#7986cb"></i>Personal</div><div><i style="background:#8e24aa"></i>Family</div><div><i style="background:#33b679"></i>Holidays</div></div></div>
    <div class="week"><div class="week-top"><span class="today-btn">Today</span><span style="color:#5f6368">‹ ›</span><span>October 2026</span></div>
    <div class="days"><div></div>${[["MON", 12], ["TUE", 13], ["WED", 14, 1], ["THU", 15], ["FRI", 16]].map(([d, n, now]) => `<div class="${now ? "now" : ""}">${d}<b>${n}</b></div>`).join("")}</div>
    <div class="grid"><div class="hours">${labels}</div>${cols}${lines}</div></div></div>`;
}

function popover() {
  const swatches = ["accent", "blue", "green", "magenta", "orange", "cyan", "yellow", "red"];
  return `<div class="pop" style="left:262px">
    <div class="pop-t">Add an account</div><div class="pop-h">It gets its own container. You sign in to Google next.</div>
    <div class="f"><span>Name</span><div class="in focus">Freelance<span class="caret"></span></div></div>
    <div class="f"><span>Email <em>· optional</em></span><div class="in">me@example.com</div></div>
    <div class="f"><span>Show in</span><div class="chips"><span class="chip">Mail</span><span class="chip">Calendar</span></div></div>
    <div class="f"><span>Color</span><div class="sw">${swatches.map((c, i) => `<i class="${i === 5 ? "sel" : ""}" style="--c:var(--t-${c})"></i>`).join("")}</div></div>
    <div class="acts"><span class="btn">Cancel</span><span class="btn p">Add account</span></div></div>`;
}

function windowHtml(t, view, { width = 1280, height = 800, addOpen = false } = {}) {
  const isCal = view === "calendar";
  const s = strip(t, isCal
    ? { app: "Calendar", accounts: CAL_ACCOUNTS, selected: "Studio" }
    : { app: "Mail", accounts: MAIL_ACCOUNTS, selected: "Studio", addOpen });
  const swatchVars = Object.entries(t).filter(([, v]) => /^#/.test(v)).map(([k, v]) => `--t-${k}:${v}`).join(";");
  return `<div class="window" style="width:${width}px;height:${height}px;${swatchVars}">${s}
    <div style="position:relative;flex:1;display:flex;min-height:0">${isCal ? calendarPage() : mailPage()}${addOpen ? popover() : ""}</div></div>`;
}

const q = new URLSearchParams(location.search);
const view = q.get("view") || "mail";
const t = THEMES[q.get("theme") || "tokyo-night"];
const root = document.getElementById("root");
document.body.setAttribute("style", styleOf(t));

if (view === "mail" || view === "calendar" || view === "add") {
  root.innerHTML = `<div class="desk" id="shot">${windowHtml(t, view === "add" ? "mail" : view, { addOpen: view === "add" })}</div>`;
} else if (view === "overview") {
  root.innerHTML = `<div class="card" id="shot" style="width:1100px">
    <h1>One window per app. One pill per Google account.</h1>
    <p class="lead">Each account lives in its own Firefox container, so they all stay signed in side by side.</p>
    <div class="big-strip">${strip(t, { app: "Mail", accounts: MAIL_ACCOUNTS, selected: "Studio" })}</div>
    <div class="feats">
      <div class="feat"><div class="k"><kbd>Alt</kbd><kbd>←</kbd><kbd>→</kbd></div><b>Switch accounts</b><span>Or Alt+1…9 to jump straight to one.</span></div>
      <div class="feat"><div class="k"><span class="count" style="--c:${t.orange};font-size:12px">12</span></div><b>Unread at a glance</b><span>Counts come from Gmail itself.</span></div>
      <div class="feat"><div class="k"><span class="add" style="margin:0">${ICONS.plus}</span><kbd>Ctrl</kbd><kbd>T</kbd></div><b>Add an account</b><span>New container, straight to sign-in.</span></div>
      <div class="feat"><div class="k"><kbd>Super</kbd><kbd>⇧</kbd><kbd>E</kbd><kbd>C</kbd></div><b>Jump to Mail or Calendar</b><span>Focuses the open window, wherever it is.</span></div>
    </div></div>`;
} else if (view === "themes") {
  root.innerHTML = `<div class="themes-wrap" id="shot" style="width:1100px">${Object.values(THEMES).map(th =>
    `<div class="theme-row" style="${styleOf(th)}"><span class="theme-name" style="color:#c8ccd4">${th.name}</span>
      <div class="big-strip" style="background:var(--bg)">${strip(th, { app: "Mail", accounts: MAIL_ACCOUNTS, selected: "Studio" })}</div></div>`).join("")}</div>`;
} else if (view === "social") {
  root.innerHTML = `<div class="social desk" id="shot" style="display:block;padding:0">
    <div class="copy"><h1>Gmail &amp; Calendar,<br><span>every account.</span></h1>
      <p>Clean Omarchy apps with one Firefox container per Google account. Switch with Alt+←/→.</p>
      <div class="keys"><kbd>Alt</kbd><kbd>←</kbd><kbd>→</kbd><span style="margin-left:6px">switch accounts</span></div></div>
    <div class="shot"><div style="transform:scale(.7);transform-origin:top left">${windowHtml(t, "mail", { width: 1280, height: 860 })}</div></div>
    <div class="repo">github.com/stewartjarod/omarchy-container-gapps</div></div>`;
}
</script>
</body>
</html>
